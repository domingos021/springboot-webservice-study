# ===================================================================
# TEST PROFILE CONFIGURATION (application-test.properties)
# ===================================================================

# -------------------------------------------------------------------
# DATASOURCE CONFIGURATION (In-Memory H2 Database for Testing)
# -------------------------------------------------------------------
# Fully qualified name of the H2 JDBC driver class
spring.datasource.driverClassName=org.h2.Driver

# In-memory database URL named 'testdb'.
# DB_CLOSE_DELAY=-1 keeps the database alive for the duration of the test context execution.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Default administrator credentials for the isolated test database
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# JPA & HIBERNATE SETTINGS
# -------------------------------------------------------------------
# Postpones database script execution (e.g., import.sql or data.sql) until JPA entity schema creation finishes
spring.jpa.defer-datasource-initialization=true

# Controls SQL output logging in the console:
# - Set to 'true' during local debugging to inspect generated SQL queries (e.g., verifying TestConfig seeding).
# - Set to 'false' in automated test suites (or 'dev' mode) to suppress SQL logs, keeping build output clean and improving execution speed.
# spring.jpa.show-sql=false
spring.jpa.show-sql=true

# Formats SQL queries into structured, readable multi-line statements in the console (active when show-sql=true)
spring.jpa.properties.hibernate.format_sql=true

# Schema management: Builds a clean database schema before tests run and drops all tables when finished
spring.jpa.hibernate.ddl-auto=create-drop