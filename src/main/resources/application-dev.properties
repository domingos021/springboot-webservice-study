# ===================================================================
# DEVELOPMENT PROFILE CONFIGURATION (application-dev.properties)
# ===================================================================

# -------------------------------------------------------------------
# DATASOURCE CONFIGURATION (In-Memory H2 Database)
# -------------------------------------------------------------------
# Fully qualified name of the H2 JDBC driver class
spring.datasource.driverClassName=org.h2.Driver

# In-memory database URL named 'testdb'.
# DB_CLOSE_DELAY=-1 keeps the in-memory database alive as long as the JVM is running.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Default administrator credentials for H2 development instance
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
# JPA & HIBERNATE SETTINGS
# -------------------------------------------------------------------
# Postpones database initialization (e.g., executing data.sql) until JPA entity schema generation finishes
spring.jpa.defer-datasource-initialization=true

# Logs generated SQL queries to the system console
spring.jpa.show-sql=true

# Formats the printed console SQL with indentation for better readability
spring.jpa.properties.hibernate.format_sql=true

# Schema management: Creates tables on startup and drops them on application shutdown
spring.jpa.hibernate.ddl-auto=create-drop