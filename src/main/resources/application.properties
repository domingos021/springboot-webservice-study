# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================

# Unique identifier for the application.
# Used in logging, metrics (Actuator), distributed tracing, and service discovery (e.g., Eureka).
spring.application.name=springboot-webservice-study

# Active Spring Profile.
# Activates profile-specific beans (e.g., @Profile("dev")) such as DevConfig
# and loads profile configuration files (e.g., application-dev.properties).
spring.profiles.active=dev

# Open Session in View (OSIV) Pattern.
# Enables keeping the JPA EntityManager/Hibernate Session open for the entire HTTP request cycle.
# - Allows lazy loading of entity relationships during view rendering or JSON serialization.
# - NOTE: Recommended for development; consider setting to 'false' in production to prevent connection pool exhaustion.
spring.jpa.open-in-view=true