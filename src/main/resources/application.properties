# ===================================================================
# MAIN APPLICATION CONFIGURATION (application.properties)
# ===================================================================

# Unique identifier for the application.
# Used in logging, metrics (Actuator), distributed tracing, and service discovery.
spring.application.name=springboot-webservice-study

# -------------------------------------------------------------------
# ACTIVE SPRING PROFILE
# -------------------------------------------------------------------
# Determines which profile-specific configuration file (application-{profile}.properties)
# and profile-annotated beans (e.g., @Profile("test") or @Profile("dev")) are loaded at application startup.
#
# Available profiles:
# - dev  : Loads application-dev.properties (for local development with persistent/dev database)
# - test : Loads application-test.properties (uses H2 in-memory DB and activates TestConfig seeding)
# - prod : Loads application-prod.properties (for production deployment)
#
# spring.profiles.active=dev
spring.profiles.active=test

# -------------------------------------------------------------------
# JPA & HIBERNATE SETTINGS
# -------------------------------------------------------------------
# Open Session in View (OSIV) Pattern:
# Keeps the JPA EntityManager/Hibernate Session open throughout the entire HTTP request lifecycle.
# - 'true'  : Allows lazy loading of related entities during JSON serialization or view rendering.
# - 'false' : Closes the database session immediately after the repository/service layer,
#             preventing connection pool exhaustion in production environments.
spring.jpa.open-in-view=true